# copycat: api + engine worker + scout scheduler + web.
#   cp .env.example .env   # fill COPYCAT_ACCOUNT_ADDRESS, COPYCAT_AGENT_KEY, optionally COPYCAT_API_TOKEN
#   docker compose up -d --build
# Only the engine signs, so only the engine gets .env (and COPYCAT_AGENT_KEY). The api gets an
# explicit allowlist of variables, interpolated from .env by compose; it never sees the key.
# Everything is published on 127.0.0.1 only. Settings ship enabled=false, dry_run=true,
# so the engine trades nothing until you flip Enabled in the UI.

x-python: &python
  build:
    context: .
    dockerfile: Dockerfile.python
  image: copycat-python:local
  volumes:
    - ./data:/data
  restart: unless-stopped

services:
  api:
    <<: *python
    command: ["python", "-m", "api"]
    # No env_file: COPYCAT_AGENT_KEY never sits in the api's environment. The api does own
    # services/vault (secrets at rest in /data/vault), and reads the host .env read-only ONLY when
    # you press "Import from .env" (POST /api/accounts/import-env), to move that key into the vault.
    volumes:
      - ./data:/data
      - ./.env:/run/copycat.env:ro
    environment:
      COPYCAT_DATA_DIR: /data
      COPYCAT_ENV_FILE: /run/copycat.env
      COPYCAT_BIND: 0.0.0.0
      COPYCAT_API_PORT: "8787"
      # Empty = the api generates a token into ./data/api_token (it always requires one).
      COPYCAT_API_TOKEN: ${COPYCAT_API_TOKEN:-}
      COPYCAT_ACCOUNT_ADDRESS: ${COPYCAT_ACCOUNT_ADDRESS:-}
      COPYCAT_NETWORK: ${COPYCAT_NETWORK:-mainnet}
      COPYCAT_WEB_ORIGIN: ${COPYCAT_WEB_ORIGIN:-http://localhost:3000}
      COPYCAT_LOG_LEVEL: ${COPYCAT_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${COPYCAT_API_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  engine:
    <<: *python
    command: ["python", "-m", "engine"]
    # The only service that signs: gets the whole .env, including COPYCAT_AGENT_KEY.
    env_file: .env
    environment:
      COPYCAT_DATA_DIR: /data
    depends_on:
      api:
        condition: service_healthy

  scout:
    <<: *python
    # Scout board builder (docs/research/copytrading_page_spec.md section 7.2): the single writer
    # of the scout_* tables in /data/discovery.db. Read-only on Hyperliquid, so no env_file and no
    # COPYCAT_AGENT_KEY. COPYCAT_HL_PRIORITY=background: it only spends the shared HL rate bucket
    # down to the engine's reserve, so its ~15k weight/hour never starves the engine.
    command: ["python", "-m", "discovery.scout", "serve"]
    environment:
      COPYCAT_DATA_DIR: /data
      COPYCAT_HL_PRIORITY: background
      COPYCAT_NETWORK: ${COPYCAT_NETWORK:-mainnet}
      COPYCAT_LOG_LEVEL: ${COPYCAT_LOG_LEVEL:-INFO}

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
      args:
        # Baked into the JS bundle at build time; rebuild after changing it.
        NEXT_PUBLIC_COPYCAT_API: ${NEXT_PUBLIC_COPYCAT_API:-http://localhost:8787}
    image: copycat-web:local
    ports:
      - "127.0.0.1:${COPYCAT_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
