[project]
name = "copycat"
version = "0.1.0"
description = "Self-hosted Hyperliquid copy trading with your own leverage and sizing."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "hyperliquid-python-sdk>=0.23",
  "eth-account>=0.13",
  "requests>=2.32",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "python-dotenv>=1.0",
  "cryptography>=43",     # services/vault: AES-GCM + scrypt for keys at rest
  "mcp>=2.3,<3",          # services/mcp (MCPServer, the v2 name for FastMCP)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = [".", "services/hl", "services/vault", "services/engine", "services/discovery", "services/api",
              "services/mcp", "services/engine/tests", "services/discovery/tests", "services/api/tests",
              "services/mcp/tests"]
testpaths = ["services/hl/tests", "services/vault/tests", "services/engine/tests", "services/discovery/tests", "services/api/tests",
             "services/mcp/tests"]
markers = ["live: hits the real Hyperliquid API (eval lane, not the gate)"]
addopts = "-m 'not live' -q --import-mode=importlib"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Correctness and import hygiene. Style rules like typing.List -> list (UP006)
# are off: the codebase uses typing generics on purpose, consistently.
select = ["E9", "F", "B", "I"]
ignore = ["B008"]   # FastAPI Depends() in defaults is the documented pattern
