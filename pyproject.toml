[project]
name = "copycat"
version = "0.1.0"
description = "Self-hosted Hyperliquid copy trading with your own leverage and sizing."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "hyperliquid-python-sdk>=0.23",
  "eth-account>=0.13",
  "requests>=2.32",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = [".", "services/hl", "services/engine", "services/discovery", "services/api"]
testpaths = ["services/hl/tests", "services/engine/tests", "services/discovery/tests", "services/api/tests", "contracts/tests"]
markers = ["live: hits the real Hyperliquid API (eval lane, not the gate)"]
addopts = "-m 'not live' -q"

[tool.ruff]
line-length = 110
